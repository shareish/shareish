version: '3.9'
volumes:
  postgis-data:
  media_volume:

services:
  db:
    image: postgis/postgis:14-3.2
    volumes:
      - postgis-data:/var/lib/postgresql/data
    env_file:
      - docker-compose.env
    restart: unless-stopped

  web:
    build: backend
    volumes:
      - ./backend:/code
      - media_volume:/code/mediafiles
      - ./backend/backups:/code/backups
    ports:
      - "8000:8000"
    env_file:
      - docker-compose.env
    depends_on:
      - db
    restart: unless-stopped

  ui:
    build:
      context: frontend
      target: dev-stage
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - media_volume:/app/web/mediafiles
    ports:
      - "8081:8080"
    depends_on:
      - web
    restart: unless-stopped

 